<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>France Article Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app">
  <header class="topbar">
    <h1>France Article Map</h1>
    <div class="filter">
      <label>
        From
        <input type="date" id="filterFrom" />
      </label>
      <label>
        To
        <input type="date" id="filterTo" />
      </label>
      <button id="clearFilter" type="button">Clear</button>
    </div>
  </header>

  <div class="tag-filter-bar">
    <span class="tag-filter-label">Tags</span>
    <div id="tagFilter" class="tag-filter"></div>
  </div>

  <main class="content">
    <div id="map"></div>

    <aside class="sidebar">
      <section class="add-article">
        <h2>Add article</h2>
        <form id="articleForm">
          <label>
            Title
            <input type="text" id="title" required placeholder="Article title" />
          </label>
          <label>
            Link (URL)
            <input type="url" id="url" required placeholder="https://..." />
          </label>
          <label>
            Date
            <input type="date" id="articleDate" required />
          </label>
          <label>
            Location name
            <input type="text" id="locationName" required placeholder="e.g. Lyon" />
          </label>
          <div class="latlng-row">
            <label>
              Latitude
              <input type="number" id="lat" step="any" required />
            </label>
            <label>
              Longitude
              <input type="number" id="lng" step="any" required />
            </label>
          </div>
          <p class="hint">Click on the map to set the location.</p>
          <label>
            Circle radius (km)
            <input type="number" id="radiusKm" min="1" max="500" step="0.5" value="10" required />
          </label>
          <label>
            Tags (comma separated)
            <input type="text" id="tags" placeholder="e.g. culture, sport" />
          </label>
          <button type="submit">Add article</button>
          <p id="formError" class="form-error"></p>
        </form>
      </section>

      <section class="article-list">
        <h2>Articles (<span id="articleCount">0</span>)</h2>
        <ul id="articleList"></ul>
      </section>
    </aside>
  </main>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
